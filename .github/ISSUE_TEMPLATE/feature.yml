name: Feature request
description: Propose a user problem and bounded capability
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, privacy, and scope impact
      description: Explain any effect on public-only data, read-only behavior, credentials, or Pages deployment.
    validations:
      required: true
